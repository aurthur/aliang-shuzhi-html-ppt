<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="mock.css"></head>
<body><div class="app">
  <div class="tb">
    <div class="lg">A</div><div class="nm">AI <b>Console</b></div>
    <div class="tabs"><a>总览</a><a>用量</a><a class="on">收入</a><a>成本</a><a>场景</a></div>
    <div class="sp"></div>
    <div class="pill"><span class="dot" style="background:var(--pos)"></span>投放策略复盘</div>
    <div class="pill">导出报告</div><div class="av"></div>
  </div>
  <div class="bd">
    <div class="h1">ROI 对比报告<span class="mu">集中投放高价值场景前 / 后 —— 结果验证了假设</span></div>
    <div class="row" style="flex:1;min-height:0;">
      <div class="card" style="flex:1.2;display:flex;flex-direction:column;">
        <div class="ct">优化前 → 优化后</div>
        <div style="flex:1;display:flex;align-items:flex-end;gap:34px;padding:18px 18px 0;">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;">
            <div style="display:flex;align-items:flex-end;gap:14px;height:210px;">
              <div style="width:46px;background:#dfe2e8;border-radius:8px 8px 0 0;height:96px;position:relative;"><span style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#9a9aa3;">2.0×</span></div>
              <div style="width:46px;background:linear-gradient(180deg,#3aa0ff,#0A84FF);border-radius:8px 8px 0 0;height:200px;position:relative;"><span style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--acc-d);">3.1×</span></div>
            </div>
            <div style="font-size:12.5px;font-weight:700;color:var(--gray);">token 变现效率</div>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;">
            <div style="display:flex;align-items:flex-end;gap:14px;height:210px;">
              <div style="width:46px;background:#dfe2e8;border-radius:8px 8px 0 0;height:62px;position:relative;"><span style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#9a9aa3;">2.0%</span></div>
              <div style="width:46px;background:linear-gradient(180deg,#3aa0ff,#0A84FF);border-radius:8px 8px 0 0;height:200px;position:relative;"><span style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--acc-d);">6.8%</span></div>
            </div>
            <div style="font-size:12.5px;font-weight:700;color:var(--gray);">付费转化</div>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;">
            <div style="display:flex;align-items:flex-end;gap:14px;height:210px;">
              <div style="width:46px;background:#dfe2e8;border-radius:8px 8px 0 0;height:200px;position:relative;"><span style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#9a9aa3;">¥1.28</span></div>
              <div style="width:46px;background:linear-gradient(180deg,#7ed79a,#1faa4b);border-radius:8px 8px 0 0;height:130px;position:relative;"><span style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--pos);">¥0.83</span></div>
            </div>
            <div style="font-size:12.5px;font-weight:700;color:var(--gray);">每千 token 成本</div>
          </div>
        </div>
        <div class="legend" style="justify-content:center;margin-top:14px;"><span><span class="dot" style="background:#dfe2e8"></span>优化前</span><span><span class="dot" style="background:var(--acc)"></span>优化后</span></div>
      </div>
      <div class="card" style="flex:.8;display:flex;flex-direction:column;justify-content:center;gap:16px;background:linear-gradient(180deg,#f2f8ff,#fff 70%);border-color:var(--acc-line);">
        <div class="ct">综合 ROI</div>
        <div class="title-xl acc">+186%</div>
        <div style="font-size:13.5px;color:var(--gray);line-height:1.6;">同样的 token 预算，集中投到高价值场景后，<b style="color:var(--ink)">营收涨、成本降</b>，综合 ROI 从 0.7 拉到 <b class="acc">2.0</b>。</div>
        <div style="display:flex;gap:10px;margin-top:4px;">
          <div style="flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;"><div class="mono pos" style="font-size:20px;">+42%</div><div style="font-size:11.5px;color:var(--gray2);font-weight:600;margin-top:4px;">营收</div></div>
          <div style="flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;"><div class="mono neg" style="font-size:20px;">−35%</div><div style="font-size:11.5px;color:var(--gray2);font-weight:600;margin-top:4px;">单位成本</div></div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
